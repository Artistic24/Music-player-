name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VIBE-Music-Player/**'
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build APKs
        working-directory: VIBE-Music-Player
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-Music-Player-release-apk
          path: VIBE-Music-Player/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-Music-Player-debug-apk
          path: VIBE-Music-Player/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Attach release APK to VIBE GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.1
          name: VIBE
          files: VIBE-Music-Player/app/build/outputs/apk/release/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
